# Builds on a version tag (e.g. v0.1.0) the Linux and Windows packages (program +
# NER plugin; Windows also as MSI) and publishes them as GitLab release.
# Intermediate pushes only run the test job.

stages: [test, build, package, release]

variables:
  APP_NAME: clipcloak
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # system libraries PySide6 needs inside the Debian slim image
  QT_DEBS: >-
    binutils libglib2.0-0 libegl1 libgl1 libfontconfig1 libx11-6 libx11-xcb1 libxkbcommon0
    libxkbcommon-x11-0 libdbus-1-3 libgssapi-krb5-2 libbrotli1 libxcb-cursor0 libxcb-icccm4
    libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
    libxcb-xkb1

cache:
  key: pip
  paths: [.cache/pip]

# ---------------------------------------------------------------- Tests
test:
  stage: test
  image: python:3.12-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends $QT_DEBS
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    # GUI tests run headless; the X11 hotkey test skips itself without a display.
    - QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -p "test_*.py" -v
  rules:
    - if: '$CI_COMMIT_TAG == null'      # every push
    - if: '$CI_COMMIT_TAG'              # and on tags

# ---------------------------------------------------------------- Build Linux
# Built on Debian 12: the binary needs glibc >= 2.36 (Debian 12, Ubuntu 24.04, Fedora 37+ …).
build:linux:
  stage: build
  image: python:3.12-slim-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends $QT_DEBS
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pyinstaller
  script:
    - python tools/check_version.py "$CI_COMMIT_TAG"
    - pyinstaller --noconfirm --clean --onefile --windowed --name "$APP_NAME"
        --add-data "$APP_NAME/resources:$APP_NAME/resources" --exclude-module tkinter run_clipcloak.py
    - mv "dist/$APP_NAME" "dist/$APP_NAME-$CI_COMMIT_TAG-linux-x86_64"
    - '"dist/$APP_NAME-$CI_COMMIT_TAG-linux-x86_64" --version'
  artifacts:
    paths: ["dist/$APP_NAME-$CI_COMMIT_TAG-linux-x86_64"]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'

# ---------------------------------------------------------------- Build Windows
# One job on a Windows runner (tag "windows"; Python 3.12 via "py", PowerShell):
# program and NER plugin as folder builds (--onedir: nothing is unpacked to %TEMP% at
# start, which AppLocker/endpoint protection prefer), optional code signing,
# MSI (WiX 5) and ZIP. Both go to the package registry (no 100 MB artifact limit).
# Without such a runner only this job fails (allow_failure) – Linux is still released.
build:windows:
  stage: build
  tags: [windows]
  allow_failure: true
  variables:
    WIX_VERSION: "5.0.2"      # WiX 6+ needs an EULA/OSMF acceptance, 5.0.2 does not
  before_script:
    - py -3 -m venv .venv-app
    - .\.venv-app\Scripts\python -m pip install --upgrade pip
    - .\.venv-app\Scripts\python -m pip install -r requirements.txt pyinstaller
    - py -3 -m venv .venv-ner
    - .\.venv-ner\Scripts\python -m pip install --upgrade pip
    - .\.venv-ner\Scripts\python -m pip install -r requirements-ner.txt pyinstaller
    # WiX as local .NET tool; installs the .NET SDK into the user profile if missing
    - if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1; powershell -NoProfile -ExecutionPolicy Bypass -File dotnet-install.ps1 -Channel 8.0 -InstallDir "$env:USERPROFILE\.dotnet"; $env:DOTNET_ROOT = "$env:USERPROFILE\.dotnet"; $env:PATH = "$env:USERPROFILE\.dotnet;$env:PATH" }
    - if (-not (Test-Path .wix\wix.exe)) { dotnet tool install wix --version $env:WIX_VERSION --tool-path .wix }
    - .\.wix\wix.exe --version
  script:
    - .\.venv-app\Scripts\python tools/check_version.py "${env:CI_COMMIT_TAG}"
    # Windows-only tests: DPAPI project encryption, policies
    - .\.venv-app\Scripts\python -m unittest tests.test_policy tests.test_projects -v
    - .\.venv-app\Scripts\python -m PyInstaller --noconfirm --clean --onedir --windowed --name "${env:APP_NAME}"
        --icon "${env:APP_NAME}/resources/icon.ico"
        --add-data "${env:APP_NAME}/resources;${env:APP_NAME}/resources" --exclude-module tkinter run_clipcloak.py
    - .\.venv-ner\Scripts\python -m PyInstaller --noconfirm --clean --onedir --console --name "${env:APP_NAME}-ner"
        --icon "${env:APP_NAME}/resources/icon.ico"
        --collect-all de_core_news_sm --collect-all en_core_web_sm
        --exclude-module spacy.tests --exclude-module pytest run_clipcloak_ner.py
    - '& "dist\${env:APP_NAME}-ner\${env:APP_NAME}-ner.exe" --selftest'
    - powershell -NoProfile -ExecutionPolicy Bypass -File tools\sign_windows.ps1 "dist\${env:APP_NAME}\${env:APP_NAME}.exe" "dist\${env:APP_NAME}-ner\${env:APP_NAME}-ner.exe"
    - $ver = (.\.venv-app\Scripts\python -c "import clipcloak; print(clipcloak.__version__)").Trim()
    - $msi = "dist\${env:APP_NAME}-${env:CI_COMMIT_TAG}-windows-x86_64.msi"
    - .\.wix\wix.exe build packaging\windows\clipcloak.wxs -arch x64 -d "Version=$ver"
        -d "AppDir=$PWD\dist\${env:APP_NAME}" -d "NerDir=$PWD\dist\${env:APP_NAME}-ner"
        -d "Icon=$PWD\${env:APP_NAME}\resources\icon.ico" -o $msi
    - powershell -NoProfile -ExecutionPolicy Bypass -File tools\sign_windows.ps1 $msi
    - .\.venv-app\Scripts\python tools/package_release.py windows "${env:CI_COMMIT_TAG}"
        --app "dist\${env:APP_NAME}" --ner "dist\${env:APP_NAME}-ner" --also $msi --upload
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'

# ---------------------------------------------------------------- NER helper (optional plugin)
# spaCy + German/English models as separate console program "<app>-ner".
# Put it next to the main binary to enable name/company detection.
build:ner:linux:
  stage: build
  image: python:3.12-slim-bookworm
  allow_failure: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends binutils
    - python -m pip install --upgrade pip
    - pip install -r requirements-ner.txt pyinstaller
  script:
    # Remove debug symbols from the spaCy/thinc/blis extensions (~120 MB -> ~82 MB binary) so the
    # artifact stays below GitLab's default 100 MB. Not "pyinstaller --strip": that also strips
    # numpy's vendored OpenBLAS and breaks it ("ELF load command ... not page-aligned").
    - python tools/strip_debug.py
    - pyinstaller --noconfirm --clean --onefile --console --name "$APP_NAME-ner"
        --collect-all de_core_news_sm --collect-all en_core_web_sm
        --exclude-module spacy.tests --exclude-module pytest run_clipcloak_ner.py
    - '"dist/$APP_NAME-ner" --selftest'
    - mv "dist/$APP_NAME-ner" "dist/$APP_NAME-ner-$CI_COMMIT_TAG-linux-x86_64"
  artifacts:
    paths: ["dist/$APP_NAME-ner-$CI_COMMIT_TAG-linux-x86_64"]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'

# ---------------------------------------------------------------- Package Linux
# tar.gz with program + NER plugin + desktop file + docs. The archive (~150 MB) goes into
# the generic package registry, not into job artifacts (GitLab's 100 MB limit).
package:linux:
  stage: package
  image: python:3.12-slim-bookworm
  needs:
    - job: build:linux
      artifacts: true
    - job: build:ner:linux
      artifacts: true
      optional: true
  script:
    - python tools/package_release.py linux "$CI_COMMIT_TAG" --dist dist --upload
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'

# ---------------------------------------------------------------- Release
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:linux
      artifacts: false
    - job: build:windows
      artifacts: false
      optional: true
  script:
    - echo "Release ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: '${APP_NAME} ${CI_COMMIT_TAG}'
    description: 'Automatic build of ${CI_COMMIT_TAG}. Windows: MSI for managed installation (msiexec /i … /qn) or the portable ZIP. Linux: tar.gz. The NER plugin is included; central settings: see README (Deployment).'
    assets:
      links:
        - name: '${APP_NAME} ${CI_COMMIT_TAG} Windows installer (MSI: program + NER plugin, for GPO/ESET/baramundi)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${APP_NAME}-${CI_COMMIT_TAG}-windows-x86_64.msi'
          link_type: package
        - name: '${APP_NAME} ${CI_COMMIT_TAG} Windows portable (ZIP: program + NER plugin + ADMX)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${APP_NAME}-${CI_COMMIT_TAG}-windows-x86_64.zip'
          link_type: package
        - name: '${APP_NAME} ${CI_COMMIT_TAG} Linux x86_64 (tar.gz: program + NER plugin)'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${CI_COMMIT_TAG}/${APP_NAME}-${CI_COMMIT_TAG}-linux-x86_64.tar.gz'
          link_type: package
        - name: '${APP_NAME} ${CI_COMMIT_TAG} Linux x86_64 (program only)'
          url: '${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/${APP_NAME}-${CI_COMMIT_TAG}-linux-x86_64?job=build:linux'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+/'
