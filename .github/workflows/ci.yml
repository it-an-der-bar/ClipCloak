# Lint and tests on every push and pull request (the GitLab pipeline does the same in its
# "test" job). Release builds: release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test-linux:
    runs-on: ubuntu-latest
    container: python:3.12-slim-bookworm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Qt system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils libglib2.0-0 libegl1 libgl1 libfontconfig1 \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libgssapi-krb5-2 libbrotli1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip; pip install -r requirements.txt
      # Windows-only parts: DPAPI, registry policies, owner check of the policy files
      - run: python -m unittest tests.test_policy tests.test_projects -v
